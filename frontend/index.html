lass="sub">Gather & Grain · ${o.date}</p><p style="margin-top:12px;font-size:13px">${o.items}</p></div><div style="text-align:right">${badge(o.status)}<p style="margin-top:15px;font-weight:700">${money(o.total)}</p></div></article>`).join('')}`:`<section class="hero"><div class="hero-copy"><span class="tag"><span class="dot"></span> GATHER & GRAIN · DALLAS</span><h1>Good food.<br/>Great company.<br/>Zero fuss.</h1><p>Fresh, thoughtful catering for your team lunches, celebrations, and everything in between.</p><button class="btn" id="browse">Find your favorites <span>↗</span></button></div><div class="hero-image" role="img" aria-label="Fresh colorful salad bowls"></div></section><div class="layout"><section id="menu-section"><div class="section-title"><div><h2>A little something for everyone.</h2><p class="sub">Made fresh. Ready when you are.</p></div><span class="prototype">6 menu items</span></div><div class="tabs" aria-label="Menu category">${['All','Breakfast','Lunch','Drinks','Desserts'].map(c=>`<button data-cat="${c}" class="${category===c?'active':''}" aria-pressed="${category===c}">${c}</button>`).join('')}</div><div class="food-grid">${menu.filter(m=>category==='All'||m.category===category).map(m=>`<article class="food"><button class="food-photo select-food" data-select="${m.id}" aria-label="See suggestions for ${m.name}"><img src="https://images.unsplash.com/${m.img}?auto=format&fit=crop&w=600&q=80" alt="${m.name}" loading="lazy"><span>${m.tag}</span></button><div class="food-info"><h3>${m.name}</h3><p>${m.desc}</p><div class="food-bottom"><strong>$${m.price} <small>/ ${m.id>3?'box or pitcher':'person'}</small></strong><button class="add" data-add="${m.id}" aria-label="Add ${m.name}">+</button></div></div></article>`).join('')}</div></section>${suggestions()}</div>`}<button class="btn floating-cart" data-tab="cart" aria-label="View cart, ${count()} items">View cart <span class="cart-count">${count()}</span><span>${money(total())}</span></button>${footer()}`}
function owner(){let revenue=orders.reduce((s,o)=>s+o.total,0);return `<div class="topline"><span class="eyebrow">GATHER & GRAIN / BUSINESS WORKSPACE</span><span class="badge">● Accepting orders</span></div><div class="dashboard-title"><div><h1>A fresh look at your business.</h1><p class="sub">Welcome back, Maya. Here’s what’s on the table.</p></div><button class="btn light" id="viewstore">View storefront ↗</button></div><div class="metrics"><div class="metric"><label>Orders in this preview</label><strong>${orders.length}</strong><small>Gather & Grain only</small></div><div class="metric"><label>Order value</label><strong>${money(revenue)}</strong><small>Sample orders · not collected revenue</small></div><div class="metric"><label>Menu items</label><strong>${menu.length}</strong><small>Available on your storefront</small></div></div><div class="dash-grid"><section class="panel"><div class="section-title"><div><h2>Recent orders</h2><p class="sub">Everything you need to prepare your next pickup.</p></div><span class="badge">${orders.length} orders</span></div>${table()}</section><aside class="panel ai"><div class="ai-top"><h3>Your AI sales assistant</h3><span class="spark">✧</span></div><div class="ai-label">Insights without the extra work</div><p>Get a quick sales recap and a suggested next favorite, using item counts and totals.</p>${insight?`<div class="ai-output"><strong>A little insight for your next service.</strong>Your ${orders.length} sample orders total ${money(revenue)}. ${topItem()} is your most ordered item.<br/><br/><strong>Next-item prediction</strong>Iced tea is the suggested next item in this illustrative preview.</div><p class="note" style="text-align:left">Preview text only. Connect your predictive and generative models to produce evaluated insights.</p>`:''}<button class="btn full" id="generate">${insight?'Refresh preview':'Generate sample insights'} <span>✧</span></button><p class="note">Preview input: menu items, counts, and totals.<br/>No customer identities included.</p></aside></div><div class="banner"><span class="spark">♧</span><span>Built for a focused workflow: review orders, see useful insights, and get back to your customers.</span></div>${footer()}`}
function topItem(){let stats={};orders.forEach(o=>o.items.split(', ').forEach(s=>{let [name,n]=s.split(' × ');stats[name]=(stats[name]||0)+Number(n||1)}));return Object.keys(stats).sort((a,b)=>stats[b]-stats[a])[0]||'No items yet'}
function admin(){return `<div class="topline"><span class="eyebrow">SIMPLECATER / PLATFORM ADMINISTRATION</span><span class="prototype">Account management</span></div><div class="dashboard-title"><div><h1>A well-run table starts here.</h1><p class="sub">Manage catering businesses. Keep the platform simple.</p></div><span class="avatar">AD</span></div><div class="metrics"><div class="metric"><label>Total businesses</label><strong>${businesses.length}</strong><small>Registered in this preview</small></div><div class="metric"><label>Active businesses</label><strong>${businesses.filter(b=>b.active).length}</strong><small>Available to accept orders</small></div><div class="metric"><label>Paused businesses</label><strong>${businesses.filter(b=>!b.active).length}</strong><small>Accounts currently disabled</small></div></div><div class="dash-grid"><section class="panel"><div class="section-title"><div><h2>Business accounts</h2><p class="sub">Enable or pause a business account.</p></div></div><div class="table-wrap"><table><thead><tr><th>Business</th><th>Owner</th><th>Status</th><th>Enabled</th></tr></thead><tbody>${businesses.map((b,i)=>`<tr><td><div style="display:flex;align-items:center;gap:11px"><span class="avatar">${b.initials}</span><div><strong>${b.name}</strong><div class="sub">${b.type}</div></div></div></td><td>${b.owner}</td><td><span class="badge ${b.active?'':'off'}">${b.active?'Active':'Paused'}</span></td><td><button class="toggle ${b.active?'on':''}" role="switch" aria-checked="${b.active}" aria-label="Enable ${b.name}" data-toggle="${i}"></button></td></tr>`).join('')}</tbody></table></div></section><aside class="panel"><div class="section-title"><h2>Keep access focused.</h2></div><p class="sub" style="font-size:13px;line-height:1.9">This admin view includes business accounts and their status. Customer profiles and individual order details stay out of this workspace.</p><div class="activity"><span class="avatar">01</span><div>Review business accounts<small>See the owner and account status.</small></div></div><div class="activity"><span class="avatar">02</span><div>Pause when needed<small>Confirm changes before applying them.</small></div></div><div class="activity"><span class="avatar">03</span><div>Keep customer details separate<small>Backend authorization must enforce access.</small></div></div></aside></div><div class="banner">Demo controls change this prototype only. Authentication, encryption, and AI will be supplied by your application backend.</div>${footer()}`}
function render(){document.querySelectorAll('[data-role]').forEach(b=>{b.classList.toggle('active',b.dataset.role===role);b.setAttribute('aria-pressed',b.dataset.role===role)});$('#avatar').textContent=role==='customer'?'JD':role==='owner'?'MC':'AD';$('#app').innerHTML=role==='customer'?customer():role==='owner'?owner():admin();bind()}
function ask(title,text,action){$('#dialog-title').textContent=title;$('#dialog-text').textContent=text;$('#confirm').showModal();$('#approve').onclick=()=>{$('#confirm').close();action()};$('#cancel').onclick=()=>$('#confirm').close()}
function bind(){document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{lastSelected=Number(b.dataset.select);render()});if($('#pickup'))$('#pickup').onchange=e=>pickupDate=e.target.value;document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let id=b.dataset.add;cart[id]=(cart[id]||0)+1;lastSelected=Number(id);render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart[b.dataset.remove]=Math.max(0,(cart[b.dataset.remove]||0)-1);render()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{customerTab=b.dataset.tab;render()});if($('#browse'))$('#browse').onclick=()=>$('#menu-section').scrollIntoView({behavior:'smooth'});if($('#checkout'))$('#checkout').onclick=()=>{let date=$('#pickup').value;if(!date||date<'2026-10-17'){toast('Choose a valid pickup date.');return}ask('Ready to place your order?',`Your demo order totals ${money(total())}, for pickup on ${date}. No payment will be collected.`,()=>{let id='SC-'+(1049+orders.filter(o=>o.new).length);orders.unshift({id,items:menu.filter(m=>cart[m.id]).map(m=>m.name+' × '+cart[m.id]).join(', '),total:total(),date,status:'Confirmed',mine:true,new:true});cart={};customerTab='orders';insight=false;render();toast('Order placed. You’re all set!')})};if($('#viewstore'))$('#viewstore').onclick=()=>{role='customer';customerTab='menu';render()};if($('#generate'))$('#generate').onclick=()=>{insight=true;render();toast('Sample insights generated — preview only.')};document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let business=businesses[b.dataset.toggle];ask(`${business.active?'Pause':'Enable'} ${business.name}?`,business.active?'This will mark the business as paused in this frontend preview.':'This will mark the business as active in this frontend preview.',()=>{business.active=!business.active;render();toast('Business account updated in preview.')})})}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;render()});render();
</script></body></html>
