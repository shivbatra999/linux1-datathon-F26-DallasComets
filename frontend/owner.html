<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SimpleCater — Good food. Less fuss.</title><meta name="description" content="A simple catering experience for customers and business owners."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"></head><body data-page="owner"><header><div class="brand"><span class="mark">♧</span>simplecater<span style="color:#8a9b72">.</span></div><div class="profile"><span class="prototype">Interactive demo</span><span class="avatar" id="avatar">JD</span></div></header><main id="app"></main><div id="toast" class="toast hidden" role="status"></div><dialog id="confirm"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div class="dialog-actions"><button class="btn light" id="cancel">Cancel</button><button class="btn" id="approve">Confirm</button></div></dialog><dialog id="profile-dialog"><h2>Your profile</h2><p class="sub">Contact details stay outside AI inputs. Encryption is performed by the connected backend.</p><form id="profile-form"><label class="field">Name<input name="name" autocomplete="name" required></label><label class="field">Email<input name="email" type="email" autocomplete="email" required></label><label class="field">Phone<input name="phone" type="tel" autocomplete="tel"></label><div class="dialog-actions"><button class="btn light" type="button" onclick="document.getElementById('profile-dialog').close()">Close</button><button class="btn" type="submit">Save profile</button></div></form></dialog><script type="module" src="./app.js"></script></body></html>
