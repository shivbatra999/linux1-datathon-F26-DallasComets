# compose.yaml
services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env}
      SIMPLECATER_ORIGIN: ${SIMPLECATER_ORIGIN:-http://127.0.0.1:8000}
      SIMPLECATER_LLM_URL: ${SIMPLECATER_LLM_URL:-http://148.100.79.228:8080/v1}
      SIMPLECATER_LLM_MODEL: ${SIMPLECATER_LLM_MODEL:-granite}
      SIMPLECATER_LLM_TIMEOUT_SECONDS: ${SIMPLECATER_LLM_TIMEOUT_SECONDS:-180}

  granite:
    platform: linux/s390x
    build: ./docker/granite
    ports:
      - "8080:8080"
    volumes:
      - granite_models:/models
    entrypoint: ["sh", "-ec"]
    command:
      - |
        model=/models/granite-4.2-3b-Q4_K_M-be.gguf
        if [ ! -f "$$model" ]; then
          mkdir -p /models
          curl --fail --location --retry 3 \
            https://huggingface.co/ibm-granite/granite-4.2-3b-GGUF/resolve/c40945d/granite-4.2-3b-Q4_K_M.gguf \
            --output "$$model.tmp"
          printf 'YES\n' | PYTHONPATH=/opt/gguf-py python3 \
            /opt/gguf-py/gguf/scripts/gguf_convert_endian.py "$$model.tmp" big
          mv "$$model.tmp" "$$model"
        fi
        exec llama-server --model "$$model" --alias granite \
          --host 0.0.0.0 --port 8080 --ctx-size 4096 --parallel 1

volumes:
  app_data:
  granite_models:
